<!doctype html>
<html><head><meta charset="utf-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1920px; height:1080px; overflow:hidden; font-family: Arial, sans-serif; }
body { background: linear-gradient(120deg, #0b1f3a 0%, #12294d 55%, #16325c 100%); }
</style></head><body>
<svg width="1920" height="1080" viewBox="0 0 1920 1080">
  <g opacity="0.12" stroke="#8fe3d8" stroke-width="2">
    <path d="M-200 1080 L2100 300 M-200 900 L2100 120 M-200 700 L2100 -80"/>
    <path d="M-200 0 L2100 780 M-200 200 L2100 980 M-200 -100 L2100 680"/>
  </g>
  <rect x="0" y="0" width="1920" height="1080" fill="url(#vig)" opacity="0.5"/>
  <defs>
    <radialGradient id="vig" cx="30%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <!-- ATM cutaway icon, left, large -->
  <g transform="translate(430,560)">
    <rect x="-230" y="-420" width="460" height="820" rx="34" fill="#12294d" stroke="#2dd4c4" stroke-width="7"/>
    <rect x="-160" y="-350" width="320" height="190" rx="14" fill="#0b1f3a" stroke="#8fe3d8" stroke-width="4"/>
    <circle cx="0" cy="-255" r="55" fill="#ffb63d" opacity="0.9"/>
    <g fill="#f4f1e8">
      <circle cx="-70" cy="-100" r="16"/><circle cx="-20" cy="-100" r="16"/><circle cx="30" cy="-100" r="16"/>
      <circle cx="-70" cy="-55" r="16"/><circle cx="-20" cy="-55" r="16"/><circle cx="30" cy="-55" r="16"/>
      <circle cx="-70" cy="-10" r="16"/><circle cx="-20" cy="-10" r="16"/><circle cx="30" cy="-10" r="16"/>
    </g>
    <rect x="-140" y="40" width="280" height="26" rx="13" fill="#0b1f3a" stroke="#ffb63d" stroke-width="4"/>

    <!-- vault cutaway lower half -->
    <rect x="-230" y="90" width="460" height="310" rx="10" fill="#0f2647"/>
    <circle cx="0" cy="245" r="115" fill="#16325c" stroke="#ffb63d" stroke-width="10"/>
    <circle cx="0" cy="245" r="115" fill="none" stroke="#2dd4c4" stroke-width="3" opacity="0.6"/>
    <g>
      <rect x="-60" y="200" width="120" height="34" rx="6" fill="#2dd4c4" transform="rotate(-8 0 217)"/>
      <rect x="-55" y="240" width="120" height="34" rx="6" fill="#8fe3d8" transform="rotate(6 5 257)"/>
      <rect x="-50" y="280" width="120" height="34" rx="6" fill="#2dd4c4" transform="rotate(-4 10 297)"/>
    </g>
  </g>

  <!-- bold text block, right -->
  <g text-anchor="start">
    <text x="900" y="430" font-size="150" font-weight="900" fill="#ffb63d" letter-spacing="2">200.000€</text>
    <text x="900" y="540" font-size="72" font-weight="900" fill="#f4f1e8" letter-spacing="1">ESCONDIDOS</text>
    <text x="900" y="625" font-size="72" font-weight="900" fill="#f4f1e8" letter-spacing="1">AQUÍ DENTRO</text>
    <text x="900" y="710" font-size="40" font-weight="400" fill="#8fe3d8">Así funciona un cajero automático por dentro</text>
  </g>

  <!-- corner accent -->
  <rect x="900" y="760" width="520" height="6" rx="3" fill="#2dd4c4" opacity="0.8"/>
</svg>
</body></html>
