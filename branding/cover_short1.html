<!doctype html>
<html><head><meta charset="utf-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1080px; height:1920px; overflow:hidden; font-family: Arial, sans-serif; }
body { background: linear-gradient(160deg, #0b1f3a 0%, #12294d 50%, #16325c 100%); }
</style></head><body>
<svg width="1080" height="1920" viewBox="0 0 1080 1920">
  <g opacity="0.12" stroke="#8fe3d8" stroke-width="2">
    <path d="M-100 1920 L1180 1400 M-100 1700 L1180 1180 M-100 1480 L1180 960"/>
    <path d="M-100 300 L1180 700 M-100 100 L1180 500 M-100 -100 L1180 300"/>
  </g>

  <text x="540" y="260" text-anchor="middle" font-size="88" font-weight="900" fill="#f4f1e8">¿Y SI SE ROMPE</text>
  <text x="540" y="360" text-anchor="middle" font-size="88" font-weight="900" fill="#ffb63d">EL CABLE?</text>

  <!-- elevator shaft icon -->
  <g transform="translate(540,1020)">
    <rect x="-160" y="-560" width="30" height="1120" fill="#2dd4c4" opacity="0.7"/>
    <rect x="130" y="-560" width="30" height="1120" fill="#2dd4c4" opacity="0.7"/>

    <!-- broken cable with jagged crack -->
    <path d="M0,-560 L0,-260" stroke="#8fe3d8" stroke-width="14" fill="none"/>
    <path d="M-40,-260 L20,-210 L-30,-170 L40,-120" stroke="#ff6b5b" stroke-width="16" fill="none" stroke-linecap="round"/>

    <!-- warning burst -->
    <g fill="#ff6b5b" opacity="0.9">
      <circle cx="0" cy="-150" r="70" opacity="0.25"/>
      <polygon points="0,-210 22,-160 -6,-160 14,-100 -35,-165 -8,-165" />
    </g>

    <!-- elevator car -->
    <rect x="-115" y="-90" width="230" height="260" rx="18" fill="#16325c" stroke="#ffb63d" stroke-width="8"/>
    <rect x="-80" y="-55" width="160" height="120" rx="10" fill="#0b1f3a" stroke="#2dd4c4" stroke-width="4"/>
    <circle cx="0" cy="100" r="14" fill="#ffb63d"/>
  </g>

  <text x="540" y="1650" text-anchor="middle" font-size="52" font-weight="700" fill="#2dd4c4">EL FRENO SECRETO</text>
  <text x="540" y="1715" text-anchor="middle" font-size="40" font-weight="400" fill="#8fe3d8">que lo evita siempre</text>

  <text x="540" y="1860" text-anchor="middle" font-size="26" font-family="monospace" font-weight="700" fill="#6ea3c9">@curioseandodescubrioelgato</text>
</svg>
</body></html>
